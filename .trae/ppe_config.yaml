# Trae PPE Configuration for Multi-Model Parallel Vibe Coding
# This config enables parallel execution across multiple AI models

version: "1.0"

# Cluster configuration
cluster:
  name: "logsift-cluster"
  description: "Multi-model parallel environment for Vibe Coding"
  nodes:
    - name: "logsift-1"
      host: "127.0.0.1"
      port: 2221
      user: "root"
      password: "password"
      model: "MinMax-M2.7"
      tags: ["primary", "minmax"]
    
    - name: "logsift-2"
      host: "127.0.0.1"
      port: 2222
      user: "root"
      password: "password"
      model: "GLM-5.1"
      tags: ["secondary", "glm"]
    
    - name: "logsift-3"
      host: "127.0.0.1"
      port: 2223
      user: "root"
      password: "password"
      model: "Qwen3.6-Plus"
      tags: ["secondary", "qwen"]
    
    - name: "logsift-4"
      host: "127.0.0.1"
      port: 2224
      user: "root"
      password: "password"
      model: "GPT-4"
      tags: ["backup", "gpt4"]
    
    - name: "logsift-5"
      host: "127.0.0.1"
      port: 2225
      user: "root"
      password: "password"
      model: "Gemini-3-Pro"
      tags: ["backup", "gemini"]

# Model rotation strategy
rotation:
  enabled: true
  order:
    - "MinMax-M2.7"
    - "GLM-5.1"
    - "Qwen3.6-Plus"
    - "GPT-4"
    - "Gemini-3-Pro"

# SSH configuration
ssh:
  strict_host_key_checking: false
  user_known_hosts_file: "/dev/null"
  control_master: "auto"
  control_path: "~/.ssh/master-%r@%h:%p"
  control_persist: "4h"
  server_alive_interval: 30
  server_alive_count_max: 3

# Environment settings
environment:
  work_dir: "/app"
  init_command: "git status"
  reset_command: "git reset --hard HEAD && git clean -fd"

# Resource management
resources:
  max_memory: "8GB"
  cpu_cores: 4
  concurrent_sessions: 5

# UI settings for Remote Explorer
ui:
  show_in_explorer: true
  group_by: "model"
  show_status: true
  show_tags: true
